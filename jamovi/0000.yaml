---
title: Functions for Medical Decision in ClinicoPath jamovi Module
name: meddecide
version: 1.0.83.07
jms: '1.0'
authors:
  - Serdar Balci
maintainer: Serdar Balci <serdarbalci@serdarbalci.com>
date: '2026-10-10'
type: R
description: >-
  A comprehensive toolkit for medical decision analysis and reliability

  assessment, implemented as a jamovi module. The package provides tools for:

  * Interrater and intrarater reliability analysis using Cohen's Kappa and
    Fleiss' Kappa statistics
  * Diagnostic test evaluation with sensitivity, specificity, predictive values,
    and likelihood ratios
  * Sample size calculations for reliability studies using confidence interval
    and power-based approaches
  * Visualization tools including Fagan nomograms for Bayesian probability
    updates
  * Power analysis for interobserver agreement studies with support for
    multiple raters and outcome categories
  Tools are provided through an intuitive graphical interface in jamovi, making

  complex medical decision analyses accessible to clinical researchers.

  For comments, suggestions, feature requests or reporting bugs, please open an
  issue at <https://github.com/sbalci/ClinicoPathJamoviModule/issues/>.
analyses:
  - title: Confidence Interval Approach for the Number of Subjects Required
    name: kappaSizeCI
    ns: meddecide
    menuGroup: Power
    menuTitle: Confidence Interval Approach for the Number of Subjects Required
    menuSubgroup: Power Analysis by meddecide
    menuSubtitle: Find sample size based on Kappa confidence
    description: >
      Number of subjects an interobserver agreement study needs for the
      confidence interval around the anticipated kappa (kappa0) to reach the
      requested precision - the confidence-interval approach of the kappaSize
      package. This is NOT a power calculation and tests no hypothesis; use
      kappaSizePower to size a study for a hypothesis test, and kappaSizeFixedN
      when the number of subjects is already fixed.
    ribbon: analyses
    category: analyses
  - title: Lowest Expected Value for a fixed sample size
    name: kappaSizeFixedN
    ns: meddecide
    menuGroup: Power
    menuTitle: Lowest Expected Value for a fixed sample size
    menuSubgroup: Power Analysis by meddecide
    menuSubtitle: Find lower Kappa based on sample size
    description: >
      For an interobserver agreement study whose number of subjects is already
      fixed, the lowest kappa the study would still be unable to rule out - the
      lower bound of the one-sided confidence interval around the anticipated
      kappa (kappa0); every value below it is excluded. Computed with the
      kappaSize package. Use kappaSizePower to size a study for a hypothesis
      test and kappaSizeCI to size it for a target interval width.
    ribbon: analyses
    category: analyses
  - title: LASSO Logistic Regression
    name: lassologistic
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Prediction Models
    menuTitle: LASSO Logistic
    menuSubtitle: Penalized feature selection for binary classification
    description: >
      Performs LASSO-penalized logistic regression for variable selection in
      binary classification problems. Ideal for diagnostic pathology studies
      that build classifiers (e.g., tumor type A vs B) with automatic feature
      selection.
  - title: Decision Curve Analysis
    name: decisioncurve
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Decision Curve Analysis
    menuTitle: Decision Curve Analysis
    menuSubtitle: Clinical Utility, Net Benefit, Threshold Analysis
    description: >
      Decision Curve Analysis for evaluating the clinical utility of prediction
      models and diagnostic tests. Calculates net benefit across threshold
      probabilities to determine if using a model provides more benefit than
      default strategies. Inputs must be probabilities for a clearly defined
      binary outcome and prediction horizon; calibration must be assessed
      separately, and this analysis does not handle censoring.
datasets:
  - name: histopathology including analysis
    path: histopathologyMedicalDecision.omv
    description: Example analysis for Medical Decision Tests.
    tags:
      - Kappa
      - Sensitivity
usesNative: true
minApp: 2.7.27

...
