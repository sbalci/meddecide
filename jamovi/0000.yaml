---
title: Functions for Medical Decision in ClinicoPath jamovi Module
name: meddecide
version: 1.0.4
jms: '1.0'
authors:
  - Serdar Balci
maintainer: Serdar Balci <serdarbalci@serdarbalci.com>
date: '2026-08-05'
type: R
description: >-
  A comprehensive toolkit for medical decision analysis and reliability

  assessment, implemented as a jamovi module. The package provides tools for:

  * Interrater and intrarater reliability analysis using Cohen's Kappa and
    Fleiss' Kappa statistics
  * Diagnostic test evaluation with sensitivity, specificity, predictive values,
    and likelihood ratios
  * Sample size calculations for reliability studies using confidence interval
    and power-based approaches
  * Visualization tools including Fagan nomograms for Bayesian probability
    updates
  * Power analysis for interobserver agreement studies with support for
    multiple raters and outcome categories
  Tools are provided through an intuitive graphical interface in jamovi, making

  complex medical decision analyses accessible to clinical researchers.

  For comments, suggestions, feature requests or reporting bugs, please open an
  issue at <https://github.com/sbalci/ClinicoPathJamoviModule/issues/>.
analyses:
  - title: Interrater Reliability
    name: agreement
    ns: meddecide
    menuGroup: meddecide
    menuSubgroup: Agreement
    menuTitle: Interrater Reliability
    description: Function for Interrater Reliability.
    ribbon: analyses
    category: analyses
  - title: Medical Decision
    name: decision
    ns: meddecide
    menuGroup: meddecide
    menuSubgroup: Decision
    menuTitle: Medical Decision
    description: >
      Function for Medical Decision Analysis. Sensitivity, Specificity, Positive
      Predictive Value, Negative Predictive Value.
    menuSubtitle: Sensitivity, Specificity, PPV, NPV
    ribbon: analyses
    category: analyses
  - title: Medical Decision Calculator
    name: decisioncalculator
    ns: meddecide
    menuGroup: meddecide
    menuSubgroup: Decision Calculators
    menuTitle: Medical Decision Calculator
    description: |
      Medical Decision Calculator for diagnostic test evaluation when you have 
      the four key counts: True Positives (TP), False Positives (FP), True 
      Negatives (TN), and False Negatives (FN). Calculates comprehensive 
      diagnostic performance metrics including sensitivity, specificity, 
      positive and negative predictive values, likelihood ratios, and 
      post-test probabilities. Supports confidence interval estimation and 
      Fagan nomogram visualization for clinical decision making.
    menuSubtitle: Sensitivity, Specificity, PPV, NPV, ...
    ribbon: analyses
    category: analyses
  - title: Power Approach for the Number of Subjects Required
    name: kappaSizePower
    ns: meddecide
    menuGroup: Power
    menuSubgroup: Power Analysis by meddecide
    menuSubtitle: Find sample size based on power
    menuTitle: Power Approach for the Number of Subjects Required
    description: |
      Power Analysis for Interobserver Agreement Analysis.
    ribbon: analyses
    category: analyses
  - title: Confidence Interval Approach for the Number of Subjects Required
    name: kappaSizeCI
    ns: meddecide
    menuGroup: Power
    menuTitle: Confidence Interval Approach for the Number of Subjects Required
    menuSubgroup: Power Analysis by meddecide
    menuSubtitle: Find sample size based on Kappa confidence
    description: |
      Power Analysis for Interobserver Agreement Analysis.
    ribbon: analyses
    category: analyses
  - title: Lowest Expected Value for a fixed sample size
    name: kappaSizeFixedN
    ns: meddecide
    menuGroup: Power
    menuTitle: Lowest Expected Value for a fixed sample size
    menuSubgroup: Power Analysis by meddecide
    menuSubtitle: Find lower Kappa based on sample size
    description: |
      Lowest Expected Value for a fixed sample size.
    ribbon: analyses
    category: analyses
  - title: Analysis Without Gold Standard
    name: nogoldstandard
    ns: meddecide
    ribbon: analyses
    menuGroup: meddecide
    menuSubgroup: Decision
    menuTitle: Analysis Without Gold Standard
    menuSubtitle: Multiple Test Analysis Without Gold Standard
    description: >
      Analysis of diagnostic tests without a gold standard reference using
      multiple statistical approaches. Implements Latent Class Analysis (Hui &
      Walter, 1980), Bayesian methods (Joseph et al., 1995),  and composite
      reference standards for estimating test performance when no perfect
      reference test exists.
    category: analyses
  - title: Compare Medical Decision Tests
    name: decisioncompare
    ns: meddecide
    menuGroup: meddecide
    menuSubgroup: Decision
    menuTitle: Compare Medical Decision Tests
    menuSubtitle: Compare sensitivity, specificity, PPV, NPV, ...
    description: >
      Function for comparing multiple Medical Decision Tests. Compares
      sensitivity, specificity, positive predictive value, negative predictive
      value, and other metrics between different tests against the same golden
      standard. Includes statistical comparison using McNemar's test and
      confidence intervals for differences.
    ribbon: analyses
    category: analyses
  - title: Clinical ROC Analysis
    name: enhancedROC
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: ROC
    menuTitle: Clinical ROC Analysis
    menuSubtitle: Clinical ROC analysis with diagnostic metrics and optimal cutoffs
    description: |
      Clinical ROC analysis toolkit for comprehensive diagnostic performance 
      evaluation. Includes ROC curve analysis, Youden Index optimization, 
      sensitivity/specificity analysis, optimal cutoff determination, and 
      comparative ROC analysis. Essential for biomarker validation, diagnostic
      test evaluation, and clinical decision support in medical research.
  - title: Advanced ROC Analysis
    name: psychopdaROC
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: ROC
    menuTitle: Advanced ROC Analysis
    menuSubtitle: Advanced ROC analysis with statistical comparisons and effect sizes
    description: >
      Receiver Operating Characteristic (ROC) curve analysis with optimal
      cutpoint determination.
  - title: Co-Testing Analysis
    name: cotest
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Decision Calculators
    menuTitle: Co-Testing Analysis
    menuSubtitle: Analyze combined test results
    description: >
      Function for analyzing combined results of two concurrent diagnostic
      tests. Calculates post-test probabilities based on various scenarios
      (either test positive, both positive, both negative).
  - title: Sequential Testing Analysis
    name: sequentialtests
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Decision Calculators
    menuTitle: Sequential Testing Analysis
    menuSubtitle: Sequential Test Analysis
    description: >-
      Analyzes how diagnostic accuracy changes when applying two tests in
      sequence,

      comparing three different testing strategies: serial positive
      (confirmation),

      serial negative (exclusion), and parallel testing. Provides comprehensive

      analysis including population flow, cost implications, and Fagan
      nomograms.
  - title: Combine Medical Decision Tests
    name: decisioncombine
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Decision
    menuTitle: Combine Medical Decision Tests
    menuSubtitle: Combine and evaluate test patterns
    description: >
      Systematic evaluation of diagnostic test combinations. Analyzes all
      possible

      test result patterns (2-test: 4 patterns, 3-test: 8 patterns) against a
      gold

      standard to identify optimal testing strategies. Calculates sensitivity,

      specificity, PPV, NPV, and accuracy for each pattern combination.
  - title: LASSO Logistic Regression
    name: lassologistic
    ns: meddecide
    category: analyses
    menuGroup: meddecide
    menuSubgroup: Prediction Models
    menuTitle: LASSO Logistic
    menuSubtitle: Penalized feature selection for binary classification
    description: >
      Performs LASSO-penalized logistic regression for variable selection in
      binary

      classification problems. Ideal for diagnostic pathology studies that build

      classifiers (e.g., tumor type A vs B) with automatic feature selection.
  - title: Clinical Scoring System Generator
    name: clinicalscore
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Prediction Models
    menuTitle: Clinical Score Builder
    menuSubtitle: Build, validate, and compare integer-point scoring systems
    description: |
      Builds clinical integer-point scoring systems from regression models using
      three published methods (Sullivan/D'Agostino, Schneeweiss, Beta10).
      Supports logistic, Cox, linear, and ordinal regression with automatic
      variable categorization, calibration, discrimination, nomogram generation,
      and TRIPOD compliance.
  - title: Decision Curve Analysis
    name: decisioncurve
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Decision Curve Analysis
    menuTitle: Decision Curve Analysis
    menuSubtitle: Clinical Utility, Net Benefit, Threshold Analysis
    description: >
      Decision Curve Analysis for evaluating the clinical utility of prediction
      models and diagnostic tests. Calculates net benefit across threshold
      probabilities to determine if using a model provides more benefit than
      default strategies.
  - title: Latent Biomarker Construct + Cox Regression
    name: latentbiomarker
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Biomarkers
    menuTitle: Latent Biomarker Construct + Cox Regression
    menuSubtitle: Reflective CFA on biomarker indicators + survival
    description: >-
      Estimate a single reflective latent biomarker construct from 3+ indicators
      and relate it to a right-censored survival outcome via Cox regression.
      Auto-selects MLR (continuous) or WLSMV (ordinal/binary) estimation.
      Refuses inappropriate inputs with explanatory messages.
  - title: Leave-One-Center-Out Cross-Validation
    name: leaveonecenterout
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Prediction Models
    menuTitle: Leave-One-Center-Out CV
    menuSubtitle: Internal-external validation for multi-institutional models
    description: |
      Performs leave-one-center-out cross-validation for multi-institutional
      prediction models. Trains on all-but-one center and evaluates on the
      held-out center, repeating for each center. Provides internal-external
      validation recommended by TRIPOD and Debray et al. (2015).
  - title: Magee Equation - Oncotype DX Estimator
    name: mageeequation
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Prediction Models
    menuTitle: Magee Equation (Oncotype DX)
    menuSubtitle: Estimate Oncotype DX Recurrence Score from pathology variables
    description: |
      Implements the Magee Equations (Klein et al. 2013, PMID: 23503643) for
      estimating Oncotype DX Recurrence Score from standard pathology variables.
      Provides all four published equations (Original + 3 new) with risk
      category classification and concordance analysis.
  - title: Misclassification Bias Sensitivity Analysis
    name: misclassificationbias
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Decision Support
    menuTitle: Misclassification Bias
    menuSubtitle: Assess impact of classification errors on effect estimates
    description: |
      Assesses how non-differential or differential misclassification of an
      exposure or outcome affects observed effect estimates (OR, RR, RD).
      Essential for studies relying on subjective classification methods
      (e.g., Ki-67 visual estimation, morphologic grading, IHC scoring).
  - title: Time-Dependent Decision Curve Analysis
    name: timedependentdca
    ns: meddecide
    category: analyses
    menuGroup: meddecideT
    menuSubgroup: Decision Curve Analysis
    menuTitle: Time-Dependent DCA
    menuSubtitle: Net benefit for survival and longitudinal data
    description: >
      Perform time-dependent Decision Curve Analysis (DCA) for survival data 

      using the dcurves package. This method extends standard DCA to evaluate

      the clinical utility of prognostic models with time-to-event outcomes.

      It calculates net benefit at specific time points, accounting for

      censoring and time-varying risk predictions. It's essential for evaluating

      survival models, recurrence prediction models, and other longitudinal
      outcomes. 

      Common applications: Serial biopsy surveillance, recurrence vs death
      prediction,

      time-varying treatment decisions.
datasets:
